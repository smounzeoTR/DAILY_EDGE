# Publishes the static legal pages (legal/) on GitHub Pages, custom domain legal.dailyedge.fr
# (until they move to the site, lot S5).
# Settings > Pages > Source: "GitHub Actions". DNS (zone dailyedge.fr): CNAME legal -> <owner>.github.io.
name: Legal pages
on:
  push:
    branches: [main]
    paths: ['legal/**', '.github/workflows/legal-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: legal
      - id: deployment
        uses: actions/deploy-pages@v4
