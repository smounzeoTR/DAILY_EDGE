# iOS shows one-time keyboard tips ("slide to type", "Inline Predictions") that cover the screen;
# close them if present.
appId: host.exp.Exponent
---
- runFlow:
    when:
      visible: '.*(Speed up your typing|Tapez plus rapidement|glissant).*'
    commands:
      - tapOn: 'Continue|Continuer'
- runFlow:
    when:
      visible: 'Inline Predictions|Prédictions intégrées'
    commands:
      - tapOn: 'Inline Predictions|Prédictions intégrées'
