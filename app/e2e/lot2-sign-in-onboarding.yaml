# Lot 2 end-to-end: intro -> sign-in with 6-digit code (Mailpit) -> onboarding
# interrupted and resumed -> program change -> 3 habits -> Today.
# Prerequisites: supabase start, Metro running (npx expo start --go), app in French.
# Run: maestro test app/e2e/lot2-sign-in-onboarding.yaml -e APP_URL=exp://127.0.0.1:8081
appId: host.exp.Exponent
env:
  APP_URL: exp://127.0.0.1:8081
  MAILPIT_URL: http://127.0.0.1:54324
---
- runFlow: subflows/sign-in-onboarding.yaml
- tapOn: 'Plus tard'

# Today
- extendedWaitUntil:
    visible: 'Jour 1 sur 28.*'
    timeout: 30000
- assertVisible: 'Bonjour !'
# Habit rows read "title, cue" (custom cue from onboarding)
- scrollUntilVisible:
    element: 'Dix idées, Après mon café'
    direction: DOWN
- takeScreenshot: e2e-07-today
